<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>디지털 저지</title>
<style>
:root{--bg:#10151c;--card:#1a222d;--line:#2b3644;--tx:#e8edf3;--dim:#93a1b3;--ok:#3ecf8e;--warn:#f5b84b;--bad:#ff6b6b;--ac:#4aa3ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;padding:12px 14px calc(24px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);
  font:14px/1.5 "Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;max-width:640px;margin:0 auto}
h1{font-size:18px;margin:6px 0 10px}h1 .ver{font-size:12px;color:var(--dim);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card h2{font-size:14px;margin:0 0 8px;color:var(--dim);font-weight:700}
button{font:inherit;font-weight:700;color:#fff;background:var(--ac);border:0;border-radius:10px;min-height:48px;padding:0 16px;width:100%;margin:6px 0}
button.sub{background:#344256}button:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
input,select{font:inherit;color:var(--tx);background:#0d1218;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;width:100%}
.code{font-size:34px;letter-spacing:6px;text-align:center;font-weight:800}
table{width:100%;border-collapse:collapse}td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--dim);white-space:nowrap;width:1%;padding-right:10px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--dim)}
#blk{position:fixed;inset:0;background:#000;z-index:9999;display:none;align-items:center;justify-content:center;color:#2b2b2b;font-size:15px;text-align:center;padding:20px}
#blk.peek{color:#bbb}
video.pv{width:100%;border-radius:8px;background:#000;display:block}
pre{white-space:pre-wrap;word-break:break-all;font:11px/1.45 ui-monospace,Menlo,monospace;color:var(--dim);margin:0;max-height:260px;overflow:auto}
</style>
</head>
<body>
<h1>디지털 저지 <span class="ver" id="verT"></span></h1>
<div id="blk"></div>

<div class="card" id="setupBox">
  <h2>연결 코드 (디지털 저지 컨트롤과 같은 4자리)</h2>
  <div class="row"><input id="sCode" class="code" inputmode="numeric" maxlength="4" placeholder="코드"><button id="sStart" style="margin:0">시작</button></div>
  <div class="dim" style="margin-top:6px">이 폰(노트 10)은 사대 뒤에 세워 두고 이 앱만 켜 두면 됩니다. 이후 모든 조작은 아이폰의 ‘디지털 저지 컨트롤’에서 합니다. 코드는 기억되고, 페이지가 새 버전으로 바뀔 때도 자동으로 다시 연결합니다.</div>
</div>
<div class="card">
  <h2>상태</h2>
  <table>
    <tr><td>연결</td><td id="sSt" class="dim">시작 전</td></tr>
    <tr><td>연결 경로</td><td id="sPath" class="dim">-</td></tr>
    <tr><td>모드</td><td id="sMode" class="dim">대기</td></tr>
    <tr><td>선수 · 차례</td><td id="sN" class="dim">-</td></tr>
    <tr><td>카메라</td><td id="sCam" class="dim">-</td></tr>
    <tr><td>마이크</td><td id="sMic" class="dim">-</td></tr>
    <tr><td>현재 소리</td><td id="sLvl" class="dim">-</td></tr>
    <tr><td>화면 유지</td><td id="sWake" class="dim">-</td></tr>
    <tr><td>최근 작업</td><td id="sLast" class="dim">-</td></tr>
  </table>
</div>
<div class="card" id="pvBox">
  <h2>카메라 미리보기 (준비 모드에서만 표시 · 대기·발시 카운트 중에는 검은 화면)</h2>
  <video id="sVid" class="pv" playsinline muted autoplay></video>
  <div class="row" style="margin-top:8px"><select id="sSel"></select></div>
</div>
<div class="card"><h2>로그</h2><pre id="log"></pre></div>

<script src="peerjs.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const VER=qs.get('fakever')||'1.0';
const cmpVer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1;}return 0;};
const rlGet=()=>{try{return sessionStorage.getItem('dj_rl')}catch(e){return null}};
const rlSet=v=>{try{sessionStorage.setItem('dj_rl',v)}catch(e){}};
const rlClr=()=>{try{sessionStorage.removeItem('dj_rl')}catch(e){}};
const T0=(performance.timeOrigin||(Date.now()-performance.now()));
const nowE=()=>T0+performance.now();           // 장치 시계(에포크 ms, 소수 포함)
const nowS=()=>performance.now()/1000;         // 판정용 시계(초)
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const jparse=(s,d)=>{try{const v=JSON.parse(s);return v==null?d:v}catch(e){return d}};
const L=[];
function log(s){const t=new Date().toTimeString().slice(0,8);L.push(t+' '+s);if(L.length>120)L.shift();const e=$('log');if(e)e.textContent=L.slice().reverse().join('\n');}
function setT(id,txt,cls){const e=$(id);if(!e)return;e.textContent=txt;e.className=cls||'';}
const f1=x=>(Math.round(x*10)/10).toFixed(1);
const PREFIX='dj-';
const hms=ms=>new Date(ms).toTimeString().slice(0,8);
/* 캐시를 피해 새 주소로 이동 — 코드·자동시작 유지 */
function goReload(){
  const u=new URL(location.href);u.searchParams.set('_',Date.now());u.searchParams.delete('fakever');u.searchParams.set('auto','1');
  const code=CODE();if(/^\d{4}$/.test(code||''))u.searchParams.set('code',code);
  location.replace(u.toString());
}
function tryUpdate(newV,say){
  if(rlGet()===newV){say&&say(`⚠ ${newV} 로 갱신했는데도 이 폰은 ${VER} — 캐시 문제일 수 있음 (주소창에서 새로고침)`,'warn');return false;}
  rlSet(newV);say&&say(`새 버전 ${newV} 로 갱신 중…`,'warn');setTimeout(goReload,400);return true;
}
async function checkLatest(say){
  try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});const t=await r.text();
    const m=t.match(new RegExp('const V'+"ER=qs.get\\('fakever'\\)\\|\\|'([^']+)'"));
    if(m&&cmpVer(m[1],VER)>0)return tryUpdate(m[1],say);}catch(e){}
  return false;
}
function mkPeer(id){
  const o={debug:0};
  const ps=qs.get('ps');                      // 시험용: ?ps=host:port (자체 시그널링 서버)
  if(ps){const a=ps.split(':');o.host=a[0];o.port=+a[1]||9000;o.path='/';o.secure=false;o.config={iceServers:[]};}
  return new Peer(id,o);
}
let wl=null;
async function keepAwake(setter){
  try{
    if(!('wakeLock' in navigator)){setter('미지원(자동잠금을 끄세요)','warn');return;}
    wl=await navigator.wakeLock.request('screen');setter('켜짐','ok');
    wl.addEventListener('release',()=>setter('해제됨(자동잠금을 끄세요)','warn'));
    document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&(!wl||wl.released)){try{wl=await navigator.wakeLock.request('screen');setter('켜짐','ok')}catch(e){}}});
  }catch(e){setter('실패: '+e.name+' (자동잠금을 끄세요)','warn');}
}
async function pathInfo(conn){
  try{
    const pc=conn.peerConnection;const st=await pc.getStats();const by={};let pair=null;
    st.forEach(r=>{by[r.id]=r});
    st.forEach(r=>{if(r.type==='transport'&&r.selectedCandidatePairId)pair=by[r.selectedCandidatePairId]});
    if(!pair)st.forEach(r=>{if(r.type==='candidate-pair'&&(r.nominated||r.selected)&&r.state==='succeeded')pair=r});
    if(!pair)return null;
    const l=by[pair.localCandidateId],r=by[pair.remoteCandidateId];if(!l||!r)return null;
    const ad=c=>(c.address||c.ip||'?')+':'+c.port;
    return {lt:l.candidateType,rt:r.candidateType,la:ad(l),ra:ad(r),proto:l.protocol};
  }catch(e){return null;}
}
function pathText(p){
  if(!p)return ['확인 불가(브라우저가 통계를 주지 않음)','warn'];
  const s=`${p.lt}↔${p.rt} · ${p.la} ↔ ${p.ra} (${p.proto})`;
  if(p.lt==='relay'||p.rt==='relay')return ['⚠ 릴레이 경유 — 인터넷 서버를 거침. 현장 LAN 직결 아님\n'+s,'warn'];
  if(p.lt==='host'&&p.rt==='host')return ['✅ LAN 직결 (host↔host)\n'+s,'ok'];
  return ['직접 연결(공인망 주소 경유)\n'+s,'ok'];
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);log('복사됨');}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');log('복사됨')}catch(x){log('복사 실패')}ta.remove();}
}
const fmtB=b=>b<1024?b+' B':(b<1048576?Math.round(b/102.4)/10+' KB':Math.round(b/104857.6)/10+' MB');

const ORT=new URL(qs.get('ort')||'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',location.href).href;
const MODEL=new URL(qs.get('model')||'../gwan-motion/models/yolov8n-pose_352x640.onnx',location.href).href;
let BS=null;
const med=a=>{const b=a.slice().sort((x,y)=>x-y);return b.length?b[b.length>>1]:0;};
let txQ=Promise.resolve();
const queueTx=fn=>{const r=txQ.then(fn);txQ=r.catch(()=>{});return r;};
const PW=640,PH=352;let LC=null;
const Q={head:0.2,sh:0.2,hip:0.2};
async function waitFrame(v,ms){const t=performance.now();while(performance.now()-t<(ms||6000)){if(v.readyState>=2&&v.videoWidth>0&&v.videoHeight>0)return true;await sleep(80);}return false;}
async function openCam(devId){
  if(S.stream)S.stream.getTracks().forEach(t=>t.stop());
  const base={width:{ideal:1920},height:{ideal:1080}};
  const v=devId?Object.assign({deviceId:{exact:devId}},base):Object.assign({facingMode:{ideal:'environment'}},base);
  try{S.stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({zoom:true},v),audio:false});}   // zoom:true → 줌 제어 권한 요청(Chrome)
  catch(e){log('zoom 포함 요청 실패('+e.name+') → 일반 요청');S.stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false});}
  S.vid.srcObject=S.stream;try{await S.vid.play()}catch(e){}
  await new Promise(r=>{if(S.vid.videoWidth)r();else S.vid.onloadedmetadata=()=>r();});
  if(!await waitFrame(S.vid,8000))log('카메라 첫 화면 대기 시간 초과');
  const tr=S.stream.getVideoTracks()[0];const st=tr.getSettings();let z=null,capMax=null;S.devId=st.deviceId||null;
  try{const cp=tr.getCapabilities();if(cp&&cp.zoom)z=[cp.zoom.min,cp.zoom.max,cp.zoom.step||0.1,st.zoom||cp.zoom.min];if(cp&&cp.width&&cp.height)capMax=[cp.width.max,cp.height.max];}catch(e){}
  S.cam={label:tr.label,w:S.vid.videoWidth,h:S.vid.videoHeight,fps:st.frameRate||null,zoom:z,facing:st.facingMode||null,cap:capMax};
  setT('sCam',camText(S.cam),'ok');
  try{
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const sel=$('sSel');sel.innerHTML='';
    ds.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||('카메라 '+(i+1));if(st.deviceId===d.deviceId)o.selected=true;sel.appendChild(o);});
  }catch(e){}
}
function camText(c){return `${c.label||'카메라'} · ${c.w}×${c.h}${c.fps?' @'+Math.round(c.fps)+'fps':''}${c.zoom?' · 줌 '+c.zoom[0]+'~'+c.zoom[1]:''}`;}
async function applyZoom(c,v){
  try{
    const tr=S.stream.getVideoTracks()[0];await tr.applyConstraints({advanced:[{zoom:v}]});S.zoomV=v;
    const z=tr.getSettings().zoom;if(S.cam&&S.cam.zoom)S.cam.zoom[3]=z;
    c.send({t:'zoomed',ok:true,req:v,v:(z==null?v:z)});setT('sCam',camText(S.cam)+' · 현재 '+f1(z==null?v:z)+'배','ok');
  }catch(e){c.send({t:'zoomed',ok:false,req:v,err:e.name+' '+e.message});log('줌 실패 '+e.name);}
}
async function camScan(c,d){S.busy=true;try{await camScanInner(c,d);}finally{S.busy=false;}}
async function camScanInner(c,d){
  const say=m=>{try{c.send({t:'fitmsg',msg:m})}catch(e){}setT('sLast',m,'dim');};
  const prev=S.devId,list=[];
  try{
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput');
    for(let i=0;i<ds.length;i++){
      const id=Date.now()+i;
      try{
        say(`카메라 ${i+1}/${ds.length} 여는 중…`);
        await openCam(ds[i].deviceId);await sleep(900);
        const v=S.vid,sc=Math.min(1,960/v.videoWidth),w=Math.round(v.videoWidth*sc),h=Math.round(v.videoHeight*sc);
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(v,0,0,w,h);
        const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8));const buf=await blob.arrayBuffer();const CH=16000,n=Math.ceil(buf.byteLength/CH);
        const info={kind:'cam',idx:i,total:ds.length,label:ds[i].label||S.cam.label,facing:S.cam.facing,zoom:S.cam.zoom,cap:S.cam.cap,mw:S.cam.w,mh:S.cam.h};
        list.push({label:info.label,facing:info.facing,w:S.cam.w,h:S.cam.h,zoom:S.cam.zoom?[S.cam.zoom[0],S.cam.zoom[1]]:null,cap:S.cam.cap});
        c.send(Object.assign({t:'ph',id,n,w:S.cam.w,h:S.cam.h,bytes:buf.byteLength,tShot:nowE()},info));
        for(let k=0;k<n;k++){while(c.dataChannel&&c.dataChannel.bufferedAmount>1500000)await sleep(20);c.send({t:'pc',id,i:k,d:buf.slice(k*CH,(k+1)*CH)});}
      }catch(e){c.send({t:'camerr',idx:i,label:ds[i].label,err:e.name+' '+e.message});}
    }
  }catch(e){c.send({t:'camerr',idx:0,label:'목록',err:e.message});}
  try{await openCam(prev||null);sendHello();}catch(e){log('원래 카메라 복원 실패 '+e.name);}
  c.send({t:'camdone',n:list.length,list});
  setT('sLast',`카메라 ${list.length}개 확인 완료`,'ok');
}
async function runBench(c){S.busy=true;try{await runBenchInner(c);}finally{S.busy=false;}}
async function runBenchInner(c){
  const say=m=>{try{c.send({t:'benchmsg',msg:m})}catch(e){}setT('sLast',m,'dim');};
  try{
    const t0=performance.now();
    await ensureModel(say);
    const loadMs=performance.now()-t0;
    const MW=640,MH=352,cv=document.createElement('canvas');cv.width=MW;cv.height=MH;const g=cv.getContext('2d');
    const v=S.vid,sc=Math.min(MW/v.videoWidth,MH/v.videoHeight),nw=Math.round(v.videoWidth*sc),nh=Math.round(v.videoHeight*sc);
    const N=MW*MH,times=[];
    for(let k=0;k<13;k++){
      say(`추론 시험 ${k}/12…`);
      g.fillStyle='#727272';g.fillRect(0,0,MW,MH);g.drawImage(v,Math.round((MW-nw)/2),Math.round((MH-nh)/2),nw,nh);
      const id=g.getImageData(0,0,MW,MH).data,f=new Float32Array(3*N);
      for(let i=0,p=0;i<N;i++,p+=4){f[i]=id[p]/255;f[N+i]=id[p+1]/255;f[2*N+i]=id[p+2]/255}
      const t1=performance.now();await BS.run({[BS.inputNames[0]]:new ort.Tensor('float32',f,[1,3,MH,MW])});
      if(k>0)times.push(performance.now()-t1);        // 첫 회(워밍업) 제외
    }
    times.sort((a,b)=>a-b);
    const simd=WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]));
    const r={t:'bench',ok:true,loadMs,med:times[times.length>>1],min:times[0],max:times[times.length-1],n:times.length,simd,threads:ort.env.wasm.numThreads,hc:navigator.hardwareConcurrency||null,mem:navigator.deviceMemory||null};
    c.send(r);setT('sLast',`자세 추론 중앙 ${f1(r.med)} ms`,'ok');
  }catch(e){c.send({t:'bench',ok:false,err:(e&&e.message)||String(e)});setT('sLast','속도 측정 실패: '+((e&&e.message)||e),'bad');}
}
async function sendAnno(c,id,o){
  return queueTx(async()=>{
    const v=S.vid;if(!await waitFrame(v,5000))throw new Error('카메라 화면이 아직 없음 (프레임 수신 전)');
    const vw=v.videoWidth,vh=v.videoHeight,sc=Math.min(1,(o.maxW||1280)/vw),W=Math.round(vw*sc),H=Math.round(vh*sc);
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
    g.drawImage(v,0,0,W,H);g.lineWidth=3;g.font='bold 22px sans-serif';
    (o.final||[]).forEach((p,i)=>{g.strokeStyle='#3ecf8e';g.strokeRect(p.x1*W,p.y1*H,(p.x2-p.x1)*W,(p.y2-p.y1)*H);g.fillStyle='#3ecf8e';g.fillText(String(i+1),p.x1*W+4,p.y1*H+22);});
    g.strokeStyle='#ff9800';g.lineWidth=2;(o.ex||[]).forEach(e=>{g.strokeRect(e.x1*W,e.y1*H,(e.x2-e.x1)*W,(e.y2-e.y1)*H);g.fillStyle='#ff9800';g.fillText('제외',e.x1*W+4,e.y1*H+22);});
    if(o.used&&o.used.w<0.999){g.strokeStyle='#00e5ff';g.lineWidth=3;g.setLineDash([10,6]);g.strokeRect(o.used.x*W,o.used.y*H,o.used.w*W,o.used.h*H);}
    g.setLineDash([]);g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,H-28,W,28);g.fillStyle='#fff';g.font='16px sans-serif';
    g.fillText(`${new Date().toTimeString().slice(0,8)} · 선수 ${(o.final||[]).length}명 · 제외 ${(o.ex||[]).length}명`,8,H-8);
    let blob=null;for(let k=0;k<3&&!blob;k++){blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',o.q||0.8));if(!blob)await sleep(200);}
    if(!blob)throw new Error('사진 인코딩 실패 (캔버스 '+W+'×'+H+')');
    const buf=await blob.arrayBuffer(),CH=16000,n=Math.ceil(buf.byteLength/CH);
    c.send({t:'ph',id,n,w:W,h:H,bytes:buf.byteLength,tShot:nowE(),kind:'fit'});
    for(let i=0;i<n;i++){while(c.dataChannel&&c.dataChannel.bufferedAmount>1500000)await sleep(20);c.send({t:'pc',id,i,d:buf.slice(i*CH,(i+1)*CH)});}
  });
}
async function sendPhoto(c,d){return queueTx(()=>sendPhotoRaw(c,d));}
async function sendPhotoRaw(c,d){
  try{
    const v=S.vid;const sc=Math.min(1,(d.maxW||1920)/v.videoWidth);
    const w=Math.round(v.videoWidth*sc),h=Math.round(v.videoHeight*sc);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(v,0,0,w,h);
    const tShot=nowE();
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',d.q||0.85));
    const buf=await blob.arrayBuffer();const CH=16000;const n=Math.ceil(buf.byteLength/CH);
    c.send({t:'ph',id:d.id,n,w,h,bytes:buf.byteLength,tShot});
    for(let i=0;i<n;i++){

async function autoFit(c,d){S.busy=true;try{await autoFitInner(c,d);}finally{S.busy=false;}}
async function autoFitInner(c,d){
  const say=m=>{try{c.send({t:'fitmsg',msg:m})}catch(e){}setT('sLast',m,'dim');};

  try{
    const v=S.vid,vw=v.videoWidth,vh=v.videoHeight,full={x:0,y:0,w:1,h:1},msgs=[];
    say('모델 준비 및 전체 화면 검사 중…');
    const P0=await detectStable(full,3);
    const exTxt=a=>`선수로 세지 않은 사람 ${a.length}명 — 머리·어깨~허리가 다 보이지 않음(${a.map(e=>`${e.why} 불명확: 머리 ${e.q.head}·어깨 ${e.q.sh}·골반 ${e.q.hip}`).join(' / ')})`;
    if(!P0.length){const m0=[{lv:'warn',t:'인식된 선수 없음 → 선수 수를 0명으로 갱신 (사대 쪽을 향하고 있는지, 선수가 서 있는지 확인)'}];if(P0.ex.length)m0.push({lv:'warn',t:exTxt(P0.ex)});
      await sendAnno(c,d.id,{final:[],ex:P0.ex,used:full,maxW:1280,q:0.8});
      c.send({t:'fit',status:'bad',n:0,ex:P0.ex.length,z:1,hBefore:0,hAfter:0,ms:performance.now()-t0,roi:full,msgs:m0});return;}
    const hBefore=Math.round(med(P0.map(p=>p.hIn)));
    // 1) 잘림 검사 (확대로는 해결 불가 → 위치 조정 경고)
    const L=P0[0],R=P0[P0.length-1];
    if(L.x1<0.012)msgs.push({lv:'bad',t:'맨 왼쪽 선수가 화면 왼쪽 끝에서 잘림 — 폰을 뒤로 물리거나 왼쪽으로 옮기세요'});
    else if(L.x1<0.04)msgs.push({lv:'warn',t:'왼쪽 여유가 거의 없음 — 더 왼쪽 선수가 화면 밖일 수 있음'});
    if(R.x2>0.988)msgs.push({lv:'bad',t:'맨 오른쪽 선수가 화면 오른쪽 끝에서 잘림 — 폰을 뒤로 물리거나 오른쪽으로 옮기세요'});
    else if(R.x2>0.96)msgs.push({lv:'warn',t:'오른쪽 여유가 거의 없음 — 더 오른쪽 선수가 화면 밖일 수 있음'});
    if(P0.some(p=>p.y1<0.01))msgs.push({lv:'bad',t:'선수 머리가 화면 위쪽에서 잘림 — 폰을 아래로 기울이거나 뒤로 물리세요'});
    if(P0.some(p=>p.y2>0.995))msgs.push({lv:'warn',t:'선수 발이 화면 아래쪽에서 잘림 (상체 인식에는 지장 없음)'});
    // 2) 확대 영역(ROI) 계산: 선수 전체 + 여백, 모델 입력 비율(640:352)로 맞춤
    const U={x1:Math.min(...P0.map(p=>p.x1)),y1:Math.min(...P0.map(p=>p.y1)),x2:Math.max(...P0.map(p=>p.x2)),y2:Math.max(...P0.map(p=>p.y2))};
    const uw=U.x2-U.x1,uh=U.y2-U.y1,asp=PW/PH,k=vw/vh/asp;      // h = w*k
    let rw=Math.min(1,uw*1.12),rh=Math.min(1,uh*1.12);

    if(rh>1){rh=1;rw=1/k>1?1:1/k;}
    let rx=(U.x1+U.x2)/2-rw/2,ry=(U.y1+U.y2)/2-rh/2;rx=Math.max(0,Math.min(1-rw,rx));ry=Math.max(0,Math.min(1-rh,ry));
    let roi={x:rx,y:ry,w:rw,h:rh};

    let P1=await detectStable(roi,3),final=P1,used=roi;
    if(P1.length<P0.length){msgs.push({lv:'warn',t:`확대하면 인식이 줄어(${P0.length}→${P1.length}명) 전체 화면을 그대로 사용`});final=P0;used=full;}
    const z=1/used.w,hAfter=Math.round(med(final.map(p=>p.hIn)));
    // 3) 크기·상체 가시성
    const hMin=Math.round(Math.min(...final.map(p=>p.hIn)));
    if(hMin<90)msgs.push({lv:'bad',t:`선수 키가 모델 입력에서 최소 ${hMin}px — 너무 작음. 폰을 사대에 더 가깝게 하거나 구역 나눠 인식 필요`});
    else if(hMin<130)msgs.push({lv:'warn',t:`선수 키가 모델 입력에서 최소 ${hMin}px — 다소 작음(임시 기준 130px). 손목 판정이 불안정할 수 있음`});
    const bad=[];final.forEach((p,i)=>{const ok=[5,6,11,12].filter(j=>p.kp[j][2]>=0.4).length;if(ok<3)bad.push(i+1);});
    if(bad.length)msgs.push({lv:'warn',t:`${bad.join(', ')}번(왼쪽부터) 선수의 어깨·골반이 불명확 — 가려졌거나 너무 작음`});
    // 4) 제외된 사람
    if(P0.ex.length){msgs.push({lv:'warn',t:exTxt(P0.ex)});
      if(P0.ex.some(e=>e.edge==='L'))msgs.push({lv:'warn',t:'왼쪽 끝에 몸 일부만 보이는 사람이 있음 — 선수라면 폰을 왼쪽으로 옮기거나 뒤로 물리세요'});
      if(P0.ex.some(e=>e.edge==='R'))msgs.push({lv:'warn',t:'오른쪽 끝에 몸 일부만 보이는 사람이 있음 — 선수라면 폰을 오른쪽으로 옮기거나 뒤로 물리세요'});}
    if(!msgs.some(m=>m.lv!=='ok'))msgs.push({lv:'ok',t:`잘림 없음 — 확대 ${f1(z)}배, 키 ${hAfter}px(모델 입력)`});
    msgs.unshift({lv:'ok',t:`선수 ${final.length}명 인식 → 선수 수를 ${final.length}명으로 갱신`});
    const status=msgs.some(m=>m.lv==='bad')?'bad':(msgs.some(m=>m.lv==='warn')?'warn':'ok');
    S.roi=used;
    // 주석 사진: 전체 프레임 + 선수 박스(번호) + 제외 박스 + 확대 영역
    await sendAnno(c,d.id,{final,ex:P0.ex,used,maxW:1280,q:0.8});
    c.send({t:'fit',status,n:final.length,ex:P0.ex.length,exq:P0.ex.map(e=>({u:Math.round(e.u*1000)/1000,why:e.why,q:e.q,edge:e.edge})),pq:final.map(p=>p.q),z,hBefore,hAfter,ms:performance.now()-t0,roi:used,msgs,persons:final.map((p,i)=>({i:i+1,u:(p.x1+p.x2)/2,hIn:Math.round(p.hIn)}))});
    setT('sLast',`화면 맞추기: ${status}, ${final.length}명, 확대 ${f1(z)}배`,status==='ok'?'ok':'warn');
  }catch(e){c.send({t:'fit',err:(e&&e.message)||String(e)});setT('sLast','화면 맞추기 실패: '+((e&&e.message)||e),'bad');}
}
async function detectStable(roi,k){let best=null;for(let i=0;i<k;i++){const r=await detect(roi);if(!best||r.length>=best.length)best=r;if(i<k-1)await sleep(200);}return best;}
async function detectVote(roi,k){
  const res=[];for(let i=0;i<k;i++){res.push(await detect(roi));if(i<k-1)await sleep(250);}
  const h={};res.forEach(r=>h[r.length]=(h[r.length]||0)+1);let best=null;
  Object.keys(h).forEach(n=>{if(best===null||h[n]>h[best]||(h[n]===h[best]&&+n>+best))best=n;});
  const r=res.filter(x=>x.length==best).pop();r.votes=h[best]+'/'+k;return r;
}

function qualify(ps0,vw,vh){

    const headOK=hc>=Q.head||(sc>=0.5&&up>=0.3*shW);          // 뒷모습: 눈·코가 안 보여도 어깨 위 머리 공간이 있으면 인정

    if(k.n>=15){J.cand=null;let pi=0;for(let i=1;i<k.rms.length;i++)if(k.rms[i]>k.rms[pi])pi=i;
      const peak=k.rms[pi],pr=peak/k.mr,low=Math.pow(k.lf[pi]/peak,2),dec=rms/peak,sharp=k.hfa[pi]/peak,dull=sharp<SHARP_MIN,ok=pr>sens.krms&&low<sens.low&&dec<0.3&&!dull;
      if(pr>5&&dec>0.5){   // 울리는 두 음 = 과녁 소리(뻐꾸기). 첫 음이 발시처럼 보일 수 있어 앞의 발시 후보를 취소한다
        cancelSound(k.t);
        if(k.t-J.lastTone>1){log('과녁 소리(뻐꾸기) 감지 · 종류 판별 중');onTone(k.t)}
        J.lastTone=k.t;}
      else if(ok){
        const info={rr:+pr.toFixed(1),hr:+k.hr.toFixed(1),low:+low.toFixed(2),dec:+dec.toFixed(2)};
        if(k.t-J.lastTone<TONE_PRE){log(`과녁 소리 직후라 발시에서 제외 (크기 ${info.rr}배)`);sndEv({k:'excl',x:'과녁 소리 직후 제외',up:info.rr});}
        else onSoundRel(k.t,info);}
      else if(pr>2){const why=dull?'둔탁한 소리(화살 맞는 소리 등)':`충격음 아님(저음 ${Math.round(low*100)}%, 잔향 ${Math.round(dec*100)}%)`;log('제외: '+why);sndEv({k:'excl',x:why,up:+pr.toFixed(1)});}
    }
    return;}
  if(hr>sens.khf)J.cand={t,n:0,rms:[rms],lf:[lf],hfa:[hf],mr:J.med.rms,hr};
}
function segment(t0,t1){   // t0..t1 사이의 소리 샘플
  const R=J.ringRate,out=[];
  for(const r of J.ring){const rt1=r.t,rt0=r.t-r.m.length/R;if(rt1<t0||rt0>t1)continue;
    const a=Math.max(0,Math.round((t0-rt0)*R)),b=Math.min(r.m.length,Math.round((t1-rt0)*R));if(b>a)out.push(r.m.subarray(a,b))}
  if(!out.length)return null;let n=0;for(const o of out)n+=o.length;const x=new Float32Array(n);let p=0;for(const o of out){x.set(o,p);p+=o.length}return x}
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<len/2;j++){const a=i+j,b=a+len/2,tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}}
/* A형(우리 관): 1294→1535→679 Hz, B형(옆 관): ~800→673→1330→673 Hz. 1500~1600 Hz 가 두 창 이상이면 A */
function classify(t){
  const x=segment(t-0.15,t+1.3);if(!x||x.length<J.ringRate*0.5)return{k:'?',why:'소리 부족'};
  const R=J.ringRate,N=1024,hop=Math.round(R*0.05),pk=[];let mx=0;
  for(let s=0;s+N<=x.length;s+=hop){const re=new Float64Array(N),im=new Float64Array(N);for(let i=0;i<N;i++)re[i]=x[s+i]*(0.5-0.5*Math.cos(2*Math.PI*i/N));fft(re,im);
    let bi=0,bm=0;for(let k=Math.floor(400*N/R);k<=Math.floor(3000*N/R);k++){const a=re[k]*re[k]+im[k]*im[k];if(a>bm){bm=a;bi=k}}
    pk.push([bi*R/N,bm]);if(bm>mx)mx=bm}
  let nA=0,nB=0;for(const[f,a]of pk){if(a<mx*0.05)continue;if(f>=1480&&f<=1600)nA++;else if(f>=1290&&f<=1350)nB++}
  return{k:nA>=2?'A':(nB>=2?'B':'?'),nA,nB};
}

/* ---------- 판정: 동작(만작→발시) ---------- */
const dc=document.createElement('canvas');const dx=dc.getContext('2d',{willReadFrequently:true});
const upOf=p=>{const h=p.y2-p.y1,sh=(p.kp[5][1]+p.kp[6][1])/2;return Math.max((sh-p.kp[9][1])/h,(sh-p.kp[10][1])/h)};
function setupDiff(){const v=S.vid;dc.width=320;dc.height=Math.max(1,Math.round(320*(v.videoHeight||9)/(v.videoWidth||16)));J.prev=null;}
function diffFrame(t){
  const v=S.vid;if(!v||v.readyState<2||!v.videoWidth)return;if(!dc.width)setupDiff();
  const W=dc.width,H=dc.height;dx.drawImage(v,0,0,W,H);const d=dx.getImageData(0,0,W,H).data;
  const g=new Uint8Array(W*H);for(let i=0,p=0;i<g.length;i++,p+=4)g[i]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8;
  if(J.prev&&J.prev.length===g.length){
    const hist=new Uint32Array(256),ab=new Uint8Array(W*H);
    for(let i=0;i<g.length;i++){const a=Math.abs(g[i]-J.prev[i]);ab[i]=a;hist[a]++}
    let acc=0,med=0;for(let k=0;k<256;k++){acc+=hist[k];if(acc>=g.length/2){med=k;break}}
    for(const s of J.slots){
      const[bx0,by0,bx1,by1]=s.box,x0=Math.max(0,Math.floor(bx0*W)-2),x1=Math.min(W,Math.ceil(bx1*W)+2),y0=Math.max(0,Math.floor(by0*H)),y1=Math.min(H,Math.floor((by0+(by1-by0)*0.6)*H));
      const h2=new Uint32Array(256);let cnt=0;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){h2[ab[y*W+x]]++;cnt++}
      let a2=0,p97=0;const target=cnt*0.97;for(let k=0;k<256;k++){a2+=h2[k];if(a2>=target){p97=k;break}}
      s.diffs.push([t,p97-med]);if(s.diffs.length>600)s.diffs.shift();
    }
  }
  J.prev=g;
}
setInterval(()=>{if(J.running&&!J.winding&&J.slots.length&&S.stream)try{diffFrame(nowS())}catch(e){}},50);
let poseOn=false;
async function poseLoop(){
  if(poseOn)return;poseOn=true;
  while(J.running&&!J.winding&&J.slots.length&&S.stream){
    const t0=performance.now();
    try{
      if(S.vid.readyState>=2&&S.vid.videoWidth){
        const ps=await queueInfer(S.roi||FULL,0.25);
        J.inferMs.push(performance.now()-t0);if(J.inferMs.length>20)J.inferMs.shift();
        if(J.running&&!J.winding)onPose(ps.tc,ps);
      }
    }catch(e){jlog('note','자세 인식 오류: '+((e&&e.message)||e));await sleep(1000);}
    const wait=POSE_DT*1000-(performance.now()-t0);await sleep(wait>0?wait:0);
  }
  poseOn=false;
}
function onPose(t,ps){
  const tol=Math.max(GAP_TOL,POSE_DT*1.5);
  for(const s of J.slots){
    let best=null,bd=1e9;for(const p of ps){const d=Math.abs((p.x1+p.x2)/2-s.cx);if(d<bd){bd=d;best=p}}
    const near=best&&bd<J.spacing*0.45;
    const up=near?upOf(best):-0.3;
    if(near&&s.state==='대기'&&up<=0){const dcx=(best.x1+best.x2)/2-s.cx;s.cx+=dcx*0.1;s.box=s.box.map((v,i)=>i%2===0?v+dcx*0.1:v)}
    if(up>0){if(s.holdStart==null)s.holdStart=t;s.lastPos=t;const dur=t-s.holdStart;s.holdDur=dur;s.state=dur>=HOLD_MIN?'만작':'준비'}
    else if(s.holdStart!=null&&t-s.lastPos>=tol){
      const dur=s.lastPos-s.holdStart;if(dur>=HOLD_MIN)motionRelease(s,s.lastPos,s.holdStart,dur);
      s.holdStart=null;s.lastPos=null;s.holdDur=0;if(s.state!=='발시')s.state='대기'}
  }
}
function motionRelease(s,end,hs,dur){
  const lo=Math.max(hs+1.0,end-WIN),hi=end+0.15,w=s.diffs.filter(d=>d[0]>=lo&&d[0]<=hi);
  let tM=end,method='자세';
  if(w.length>3){const mx=Math.max(...w.map(d=>d[1])),thr=Math.max(DIFF_MIN,FRAC*mx),f=w.find(d=>d[1]>thr);if(f){tM=f[0];method='동작'}}
  s.state='발시';setTimeout(()=>{if(s.state==='발시')s.state='대기'},1500);
  J.pend.push({idx:J.slots.indexOf(s),no:s.no,tM,dur,method});
  log(`${s.no}번 동작 발시 (만작 ${dur.toFixed(1)}초, ${method}) · 소리와 맞추는 중`);
}

/* ---------- 판정: 기록 (발시 · 관중 · 불) ---------- */
function advance(){const N=Math.max(1,J.N);J.ptr.p++;if(J.ptr.p>=N){J.ptr.p=0;J.ptr.s++}
  if(J.ptr.s>=J.A){J.ptr={p:0,s:0};J.sun++;jlog('note',`${J.sun-1}순 끝. ${J.sun}순 시작`)}}
function onRelease(t,src,info){
  const a={id:++J.aid,sun:J.sun,p:J.ptr.p,s:J.ptr.s,tRel:t,tFlash:null,dt:null,res:'pending',src,flags:[],srcs:[],manual:false,wt:Math.round(Date.now()-(nowS()-t)*1000)};
  if(src==='motion')a.flags.push('소리 미확인');
  J.arrows.push(a);J.lastRelAny=t;
  jlog('rel',`발시 ${a.p+1}번 선수 · ${a.sun}순 ${a.s+1}시`+(src==='sound'?` (현소리${info&&info.motion!=null?' · 동작 확인':''})`:src==='motion'?' (동작만, 소리 미확인)':src==='manual'?' (수동)':''),t);
  advance();sendBoard();
  const c=S.conn;if(c&&c.open)c.send({t:'ev',k:a.id,p:a.p+1,s:a.s+1,u:a.sun,w:a.wt});
}
function flightMed(){const f=J.arrows.filter(a=>a.res==='hit'&&a.dt!=null&&a.src!=='missing').map(a=>a.dt);return f.length>=3?median(f):2.8}
function onFlash(tf,kind){
  const dup=J.arrows.find(a=>a.tFlash!=null&&Math.abs(tf-a.tFlash)<2.5);
  if(dup){if(!dup.srcs.includes('뻐꾸기')){dup.srcs.push('뻐꾸기');sendBoard();}return}
  const lo=J.wa-0.3,hi=J.wb+0.3;
  const cands=J.arrows.filter(a=>a.tRel!=null&&!a.manual&&(a.res==='pending'||(a.res==='miss'&&(a.src==='sound'||a.src==='motion')&&a.tFlash==null))&&tf-a.tRel>=lo&&tf-a.tRel<=hi);
  if(cands.length){
    const fm=flightMed();cands.sort((x,y)=>Math.abs(tf-x.tRel-fm)-Math.abs(tf-y.tRel-fm));
    const a=cands[0],amb=cands.length>1&&Math.abs(Math.abs(tf-cands[1].tRel-fm)-Math.abs(tf-a.tRel-fm))<0.25;
    a.res='hit';a.tFlash=tf;a.dt=tf-a.tRel;a.srcs.push('뻐꾸기');if(amb&&!a.flags.includes('신호 겹침'))a.flags.push('신호 겹침');
    jlog('hit',`관중 ${a.p+1}번 선수 · ${a.sun}순 ${a.s+1}시 · 발시 후 ${a.dt.toFixed(2)}초 (뻐꾸기)`+(amb?' · 다른 발시와 겹쳐 확인 필요':''),tf);
    sendBoard();
  }else{                                    // 발시를 놓쳤는데 관중 소리만 들림 → 현재 차례의 발시로 기록 (확인 필요)
    const a={id:++J.aid,sun:J.sun,p:J.ptr.p,s:J.ptr.s,tRel:null,tFlash:tf,dt:null,res:'hit',src:'missing',flags:['발시 미확인'],srcs:['뻐꾸기'],manual:false,wt:Math.round(Date.now()-(nowS()-tf)*1000)};
    J.arrows.push(a);J.lastRelAny=tf-2.8;
    jlog('hit',`관중 ${a.p+1}번 선수 · ${a.sun}순 ${a.s+1}시 · 발시 소리 없이 뻐꾸기만 (확인 필요)`,tf);advance();sendBoard();
  }
}
function jtick(){
  const t=nowS();
  while(J.snd.length&&t-J.snd[0].t>30)J.snd.shift();
  if(J.running){
    if(!J.winding){
      for(let i=J.pend.length-1;i>=0;i--){const p=J.pend[i];if(t<p.tM+RESOLVE_LAG)continue;J.pend.splice(i,1);
        let best=null;for(const e of J.snd){if(e.used||e.cancel)continue;const d=Math.abs(e.t-p.tM);if(d<=SND_MATCH&&(!best||d<Math.abs(best.t-p.tM)))best=e}
        const sl=J.slots[p.idx];
        // 이미 발시한 선수는 다음 차례까지 잠금: 발시 뒤 손이 올라가도 새 발시로 세지 않는다
        if(sl&&sl.lastRelT!=null&&p.tM-sl.lastRelT<LOCK){log(`${p.no}번은 방금 발시해서 동작 무시 (${(p.tM-sl.lastRelT).toFixed(1)}초 전)`);continue}
        // 소리 없는 동작이 차례가 아닌 선수에게서 나오면 잡음으로 본다
        if(!best&&p.idx!==J.ptr.p){jlog('note',`${p.no}번 동작은 차례(${J.ptr.p+1}번)도 아니고 발시음도 없어 제외`,p.tM);continue}
        if(best)best.used=true;
        if(p.idx!==J.ptr.p){jlog('note',`순서 다름: 차례 ${J.ptr.p+1}번, 동작은 ${p.no}번 · 동작 기준으로 맞춤`,p.tM);J.ptr.p=p.idx}
        if(sl)sl.lastRelT=best?best.t:p.tM;
        if(best)onRelease(best.t,'sound',Object.assign({},best.info,{motion:+(p.tM-best.t).toFixed(2)}));
        else onRelease(p.tM,'motion',{rr:0});
      }
      if(J.mode==='sound'){   // 자세로 선수를 못 찾을 때: 현소리만으로 발시를 센다 (뻐꾸기로 취소되지 않은 소리)
        for(const e of J.snd){if(e.used||e.cancel||t<e.t+RESOLVE_LAG)continue;e.used=true;
          if(e.t-J.lastRelAny<SOUND_ONLY_LOCK){log('직전 발시와 너무 가까운 소리 — 제외');continue}
          onRelease(e.t,'sound',e.info);}
      }
    }
  }
  // 뻐꾸기 종류 판별 (마이크가 켜져 있는 동안 항상 — 준비 모드에서도 소리 점검용으로 결과를 보냄)
  for(const e of J.tones){if(e.done||t<e.t+TONE_WAIT)continue;e.done=true;const r=classify(e.t);
    const acc=J.toneMode!=='off'&&(r.k==='A'||(J.toneMode==='A?'&&r.k==='?')||J.toneMode==='any');
    const use=acc&&J.running;
    sndEv({k:'tone',cl:r.k,nA:r.nA,nB:r.nB,why:r.why,acc:use});
    if(use){log('뻐꾸기 '+r.k+'형 → 관중 신호');onFlash(e.t,'tone')}
    else if(r.k==='B')log('옆 관 뻐꾸기(B형) · 제외');
    else log(`뻐꾸기 종류 ${r.k==='A'?'A':'불명'} · ${J.running?'제외':'(카운트 중 아님)'} ${r.why||`(A${r.nA}/B${r.nB})`}`);
  }
  while(J.tones.length&&J.tones[0].done&&t-J.tones[0].t>10)J.tones.shift();
  // 불(관중 없음) 확정
  if(J.running&&J.toneMode!=='off'){let ch=false;
    for(const a of J.arrows)if(a.res==='pending'&&a.tRel!=null&&!a.manual&&t>a.tRel+J.wb+MISS_GRACE){a.res='miss';ch=true;jlog('note',`불 ${a.p+1}번 선수 · ${a.sun}순 ${a.s+1}시`,t)}
    if(ch)sendBoard();}
  if(S.mode==='count'){setBlk(`🏹 ${J.N}명 · ${J.sun}순 · 다음 ${J.ptr.p+1}번 ${J.ptr.s+1}시 · 발시 ${J.arrows.length}`);}
  if(++J.tk%5===0&&document.visibilityState==='visible'&&S.mode!=='standby')setT('sN',S.mode==='count'?`${J.N}명 확정 · ${J.sun}순 · 다음 ${J.ptr.p+1}번 ${J.ptr.s+1}시 · 발시 ${J.arrows.length} · 자세 ${J.inferMs.length?Math.round(J.inferMs.reduce((a,b)=>a+b)/J.inferMs.length):'-'}ms`:(J.N?`마지막 확정 ${J.N}명`:'-'),'dim');
}
setInterval(jtick,100);
function sendSt(force){
  const c=S.conn;if(!c||!c.open)return;
  const sl=J.slots.map(s=>s.state==='만작'||s.state==='준비'?s.state+' '+(Math.round(s.holdDur*2)/2).toFixed(1):s.state);
  const sig=[S.mode,J.N,S.locked,J.sun,J.ptr.p,J.ptr.s,J.winding,J.mode,sl.join('|')].join(',');
  if(!force&&sig===J.lastSt)return;J.lastSt=sig;
  c.send({t:'st',m:S.mode,n:J.N,lk:S.locked,u:J.sun,p:J.ptr.p,s:J.ptr.s,wd:J.winding,sl,jm:J.mode});
}
setInterval(()=>sendSt(false),500);

/* ---------- 컨트롤의 수동 편집 ---------- */
function editOp(d){
  if(d.op==='res'){const a=J.arrows.find(x=>x.id===d.id);if(a){a.res=d.r;a.manual=true;if(!a.flags.includes('수동'))a.flags.push('수동');jlog('note',`수동 수정: ${a.p+1}번 선수 ${a.sun}순 ${a.s+1}시 → ${d.r==='hit'?'관중':d.r==='miss'?'불':'판정 전'}`);}}
  else if(d.op==='undo'){const a=J.arrows.pop();if(a){J.sun=a.sun;J.ptr={p:a.p,s:a.s};jlog('note',`취소: ${a.p+1}번 선수 ${a.sun}순 ${a.s+1}시`);}}
  else if(d.op==='add'){onRelease(nowS(),'manual',{});return}
  else if(d.op==='ptr'){if(d.p!=null)J.ptr.p=Math.max(0,Math.min(Math.max(0,J.N-1),d.p|0));if(d.s!=null)J.ptr.s=Math.max(0,Math.min(J.A-1,d.s|0));if(d.u!=null)J.sun=Math.max(1,d.u|0);jlog('note',`차례 수정: ${J.sun}순 ${J.ptr.p+1}번 ${J.ptr.s+1}시`);}
  else if(d.op==='nextsun'){J.ptr={p:0,s:0};J.sun++;jlog('note',`${J.sun}순으로 넘김`);}
  else if(d.op==='clear'){J.arrows=[];J.aid=0;J.sun=1;J.ptr={p:0,s:0};J.pend=[];for(const s of J.slots)s.lastRelT=null;jlog('note','기록을 모두 지웠습니다');}
  sendBoard();sendSt(true);
}
initSlave();

</script>
