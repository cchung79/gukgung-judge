<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관중 시험 컨트롤</title>
<style>
:root{--bg:#10151c;--card:#1a222d;--line:#2b3644;--tx:#e8edf3;--dim:#93a1b3;--ok:#3ecf8e;--warn:#f5b84b;--bad:#ff6b6b;--ac:#4aa3ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;padding:12px 14px calc(24px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);
  font:14px/1.5 "Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;max-width:640px;margin:0 auto}
h1{font-size:18px;margin:6px 0 10px}h1 .ver{font-size:12px;color:var(--dim);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card h2{font-size:14px;margin:0 0 8px;color:var(--dim);font-weight:700}
button{font:inherit;font-weight:700;color:#fff;background:var(--ac);border:0;border-radius:10px;min-height:48px;padding:0 16px;width:100%;margin:6px 0}
button.sub{background:#344256}.bsub{font-weight:400;font-size:12px}.cmdmain button{min-height:68px}button.newb{background:#2b3442;border:2px solid #c0504d;color:#ffb3b0}button.newb.arm{background:#e0a030;border-color:#e0a030;color:#1a1a1a}button.go{background:#1e9e66}button.stop{background:#c0504d}button:disabled{opacity:.4}
button.sm{min-height:38px;font-size:13px;padding:0 10px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.g6 button{margin:0;padding:0;min-height:44px;font-size:16px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
input,select{font:inherit;color:var(--tx);background:#0d1218;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;width:100%}
input[type=checkbox]{width:auto;min-height:0;margin-right:6px}
.code{font-size:34px;letter-spacing:6px;text-align:center;font-weight:800}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
.kv td:first-child{color:var(--dim);white-space:nowrap;width:1%;padding-right:10px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
#bMic.bad{background:#7a2a2a;color:#fff}.dim{color:var(--dim)}
.big{font-size:16px;font-weight:700}.huge{font-size:22px;font-weight:800}
img.shot{width:100%;border-radius:8px;background:#000;display:block;margin-top:6px}
pre{white-space:pre-wrap;word-break:break-all;font:11px/1.45 ui-monospace,Menlo,monospace;color:var(--dim);margin:0;max-height:220px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{flex:1 1 70px;min-width:70px;border:2px solid var(--line);border-radius:10px;padding:5px 6px;text-align:center;background:#0d1218;font-size:12px}
.chip b{display:block;font-size:15px}.chip.cur{border-color:var(--ac)}
.chip.s-준비{background:#3a3a14}.chip.s-만작{background:#4a3a10}.chip.s-발시{background:#4a1c1c}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.tabs button{width:auto;min-height:34px;font-size:13px;padding:0 12px;margin:0;background:#2a3544}.tabs button.on{background:var(--ac)}
.bd th{color:var(--dim);font-weight:400;font-size:12px}.bd td,.bd th{text-align:center;border:1px solid var(--line);padding:6px 2px}
.bd td.c{font-size:18px;font-weight:800;min-width:36px}.bd td.cur{outline:2px solid var(--ac);outline-offset:-2px}
.bd .h{color:var(--ok)}.bd .m{color:var(--bad)}.bd .p{color:var(--dim)}
.bd th.pl{font-size:13px;color:var(--tx);min-width:56px}.bd th.pl span{font-size:11px;color:var(--dim)}.bd th.s-준비{background:#3a3a14}.bd th.s-만작{background:#4a3a10}.bd th.s-발시{background:#4a1c1c}
.bd sup{font-size:10px;color:var(--warn)}
details.sub{margin:8px 0;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#161d27}details.sub>summary{padding:11px 0;color:var(--tx);font-size:15px}
.tgchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tgchips button{width:auto;min-width:52px;min-height:42px;margin:0;padding:0 10px;background:#2a3544}.tgchips button.on{background:#ffb300;color:#1a1a1a}
#selWrap{position:relative;margin-top:8px}#selWrap img{display:block;width:100%}#selOv{position:absolute;inset:0}.tgb{position:absolute;border-radius:4px;cursor:pointer}.tgb.on{background:rgba(255,179,0,.22);outline:3px solid #ffb300;outline-offset:-3px}
.log div{padding:2px 0;border-top:1px solid var(--line);font-size:13px}
.log .hit{color:var(--ok)}.log .rel{color:var(--tx)}.log .note{color:var(--dim)}
details{margin:10px 0}summary{cursor:pointer;color:var(--dim);font-weight:700;padding:8px 0}
.banner{background:#4a1c1c;border:1px solid var(--bad);border-radius:10px;padding:8px 10px;margin:8px 0}
.cnt3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin:6px 0}.cnt3>div{background:#0d1218;border:1px solid var(--line);border-radius:12px;padding:8px 2px}.cnt3 .num{font-size:44px}.cnt3 .dim{font-size:12px}
.tl .C{color:#9be7a6}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin:6px 0}.cnt>div{background:#0d1218;border:1px solid var(--line);border-radius:12px;padding:8px 4px}.num{font-size:54px;font-weight:800;line-height:1.1}
button.tapb{min-height:84px;font-size:20px;background:#6b4fd8}button.tapb:active{background:#8a72f0}
.lvl{height:14px;background:#0c1118;border-radius:7px;overflow:hidden;margin:6px 0}.lvl>div{height:100%;width:0;background:var(--ok)}
.tl div{padding:4px 0;border-top:1px solid var(--line);font-size:13px;display:flex;gap:8px}.tl .t{flex:0 0 76px;color:var(--dim)}.tl .k{flex:0 0 52px;font-weight:700}.tl .L{color:#ffc53d}.tl .V{color:#7fd0ff}.tl .W{color:var(--dim)}
</style>
</head>
<body>
<h1>관중 시험 컨트롤 <span class="ver" id="verT"></span></h1>
<div id="banner"></div>

<div class="card" id="startBox">
  <h2>연결 코드 (샤오미 ‘관중 폰’과 같은 4자리)</h2>
  <div class="row"><input id="tCode" class="code" inputmode="numeric" maxlength="4"><button id="tStart" style="margin:0">시작</button></div>
</div>

<div class="card">
  <h2>샤오미 (관중 폰)</h2>
  <div id="lpSt" class="huge dim">연결 전</div>
  <div id="lpLine" class="dim"></div>
  <button id="bRun" class="go" disabled style="min-height:80px"><span id="bRunT">▶ 시험 시작</span><br><span id="bRunS" class="bsub">샤오미를 깨워 램프·뻐꾸기를 셉니다</span></button>
  <div class="row"><button id="bSleep" class="sub" disabled>⏸ 샤오미 절전</button><button id="bWake" class="sub" disabled>💡 샤오미 깨우기</button></div>
  <div class="dim">램프 지정·줌은 샤오미 화면에서 먼저 하세요. 끝나면 샤오미의 「설정 완료 (절전으로)」 또는 여기 ⏸ 절전. 사대에 선 뒤 ▶ 시험 시작.</div>
</div>

<div class="card">
  <h2>관중 신호(램프·뻐꾸기) ↔ 내 신호</h2>
  <div class="cnt3"><div><div class="num" id="nL">0</div><div class="dim">램프</div></div><div><div class="num" id="nT">0</div><div class="dim" id="nTt">뻐꾸기 감지</div></div><div><div class="num" id="nV">0</div><div class="dim" id="nVt">내 신호</div></div></div>
  <table class="kv" id="cmpT"></table>
  <div id="grpT" class="dim"></div>
  <div id="verdict" class="big dim">시험 시작 전</div>
  <button id="bTap" class="tapb">👆 관중 (수동 +1)</button>
  <div class="row"><button id="bMic" class="sub">🎤 마이크 켜기</button><select id="mMode"><option value="pat">패턴 인식 (내 목소리)</option><option value="word">단어 인식 (사파리)</option><option value="level">소리 크기</option></select></div>
  <div class="row"><select id="mSens"><option value="10">감도 높음</option><option value="14" selected>감도 보통</option><option value="20">감도 낮음</option></select></div>
  <div class="lvl" id="lvlBox"><div id="lvlB"></div></div>
  <div id="lvlT" class="dim">마이크 꺼짐</div>
  <div id="patBox"><div class="row"><button id="bReg" class="sub">🎓 내 목소리 등록 (관중 ×5)</button><button id="bRegClr" class="sub sm">등록 지우기</button></div>
    <div class="row"><select id="mStrict"><option value="1.3">엄격 (닮은 것만)</option><option value="1.6" selected>보통</option><option value="2.2">관대 (놓치지 않게)</option></select></div>
    <div id="patT" class="dim"></div></div>
  <div class="dim" id="micHelp"></div>
</div>

<div class="card"><h2>기록 (최신순)</h2><div class="tl" id="tl"></div>
  <div class="row"><button id="bCopy" class="sub sm">복사 (CSV)</button><button id="bClr" class="stop sm">기록 지우기</button></div></div>

<details class="card"><summary>연결 정보</summary>
  <table class="kv">
    <tr><td>연결</td><td id="mSt" class="dim">시작 전</td></tr>
    <tr><td>연결 경로</td><td id="mPath" class="dim">-</td></tr>
    <tr><td>시계 차</td><td id="mOff" class="dim">-</td></tr>
    <tr><td>샤오미 배터리·버전</td><td id="mBat" class="dim">-</td></tr>
    <tr><td>샤오미 카메라</td><td id="mCam" class="dim">-</td></tr>
    <tr><td>화면 유지(이 폰)</td><td id="mWake" class="dim">-</td></tr>
  </table>
  <button id="mReload" class="sub sm" disabled>샤오미 새로고침 (최신 버전으로)</button>
</details>
<div class="card"><h2>로그</h2><pre id="log"></pre></div>

<script src="peerjs.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const VER=qs.get('fakever')||'1.9.5';
const cmpVer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1;}return 0;};
const rlGet=()=>{try{return sessionStorage.getItem('dj_rl')}catch(e){return null}};
const rlSet=v=>{try{sessionStorage.setItem('dj_rl',v)}catch(e){}};
const rlClr=()=>{try{sessionStorage.removeItem('dj_rl')}catch(e){}};
const T0=(performance.timeOrigin||(Date.now()-performance.now()));
const nowE=()=>T0+performance.now();           // 장치 시계(에포크 ms, 소수 포함)
const nowS=()=>performance.now()/1000;         // 판정용 시계(초)
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const jparse=(s,d)=>{try{const v=JSON.parse(s);return v==null?d:v}catch(e){return d}};
const L=[];
function log(s){const t=new Date().toTimeString().slice(0,8);L.push(t+' '+s);if(L.length>120)L.shift();const e=$('log');if(e)e.textContent=L.slice().reverse().join('\n');}
function setT(id,txt,cls){const e=$(id);if(!e)return;e.textContent=txt;e.className=cls||'';}
const f1=x=>(Math.round(x*10)/10).toFixed(1);
const PREFIX='dj-';
const hms=ms=>new Date(ms).toTimeString().slice(0,8);
/* 캐시를 피해 새 주소로 이동 — 코드·자동시작 유지 */
function goReload(){
  const u=new URL(location.href);u.searchParams.set('_',Date.now());u.searchParams.delete('fakever');u.searchParams.set('auto','1');
  const code=CODE();if(/^\d{4}$/.test(code||''))u.searchParams.set('code',code);
  location.replace(u.toString());
}
function tryUpdate(newV,say){
  if(rlGet()===newV){say&&say(`⚠ ${newV} 로 갱신했는데도 이 폰은 ${VER} — 캐시 문제일 수 있음 (주소창에서 새로고침)`,'warn');return false;}
  rlSet(newV);say&&say(`새 버전 ${newV} 로 갱신 중…`,'warn');setTimeout(goReload,400);return true;
}
async function checkLatest(say){
  try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});const t=await r.text();
    const m=t.match(new RegExp('const V'+"ER=qs.get\\('fakever'\\)\\|\\|'([^']+)'"));
    if(m&&cmpVer(m[1],VER)>0)return tryUpdate(m[1],say);}catch(e){}
  return false;
}
function mkPeer(id){
  const o={debug:0};
  const ps=qs.get('ps');                      // 시험용: ?ps=host:port (자체 시그널링 서버)
  if(ps){const a=ps.split(':');o.host=a[0];o.port=+a[1]||9000;o.path='/';o.secure=false;o.config={iceServers:[]};}
  return new Peer(id,o);
}
let wl=null;
async function keepAwake(setter){
  try{
    if(!('wakeLock' in navigator)){setter('미지원(자동잠금을 끄세요)','warn');return;}
    wl=await navigator.wakeLock.request('screen');setter('켜짐','ok');
    wl.addEventListener('release',()=>setter('해제됨(자동잠금을 끄세요)','warn'));
    document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&(!wl||wl.released)){try{wl=await navigator.wakeLock.request('screen');setter('켜짐','ok')}catch(e){}}});
  }catch(e){setter('실패: '+e.name+' (자동잠금을 끄세요)','warn');}
}
async function pathInfo(conn){
  try{
    const pc=conn.peerConnection;const st=await pc.getStats();const by={};let pair=null;
    st.forEach(r=>{by[r.id]=r});
    st.forEach(r=>{if(r.type==='transport'&&r.selectedCandidatePairId)pair=by[r.selectedCandidatePairId]});
    if(!pair)st.forEach(r=>{if(r.type==='candidate-pair'&&(r.nominated||r.selected)&&r.state==='succeeded')pair=r});
    if(!pair)return null;
    const l=by[pair.localCandidateId],r=by[pair.remoteCandidateId];if(!l||!r)return null;
    const ad=c=>(c.address||c.ip||'?')+':'+c.port;
    return {lt:l.candidateType,rt:r.candidateType,la:ad(l),ra:ad(r),proto:l.protocol};
  }catch(e){return null;}
}
function pathText(p){
  if(!p)return ['확인 불가(브라우저가 통계를 주지 않음)','warn'];
  const s=`${p.lt}↔${p.rt} · ${p.la} ↔ ${p.ra} (${p.proto})`;
  if(p.lt==='relay'||p.rt==='relay')return ['⚠ 릴레이 경유 — 인터넷 서버를 거침. 현장 LAN 직결 아님\n'+s,'warn'];
  if(p.lt==='host'&&p.rt==='host')return ['✅ LAN 직결 (host↔host)\n'+s,'ok'];
  return ['직접 연결(공인망 주소 경유)\n'+s,'ok'];
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);log('복사됨');}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');log('복사됨')}catch(x){log('복사 실패')}ta.remove();}
}
const fmtB=b=>b<1024?b+' B':(b<1048576?Math.round(b/102.4)/10+' KB':Math.round(b/104857.6)/10+' MB');

/* ================= 램프 시험 컨트롤 (아이폰) =================
   오늘의 시험용 최소 컨트롤: 샤오미(램프 폰)만 연결해 램프 점멸 횟수를 세고,
   내가 이어폰 마이크로 램프가 켜질 때마다 「관중」이라고 말한 횟수(또는 수동 버튼)와 비교한다. */
const CODE=()=>$('tCode').value.trim();
const T={peer:null,lc:null,off:null,offErr:null,rtt:null,pr:[],hello:null,st:null,lsAt:0,running:lsG('dj_trun')==='1',ev:[],startTries:0,bat:null,
  mic:{want:false,flat:0,on:false,ctx:null,stream:null,an:null,buf:null,hist:[],last:-1e9,above:0,t:null,db:-120,floor:-80}};
const PAIR_LO=-0.8,PAIR_HI=3.5;     // 램프 대비 내 신호가 이 범위(초) 안에 있으면 한 쌍
$('verT').textContent='v'+VER+' · 아이폰';
const lpUp=()=>!!(T.lc&&T.lc.open);
const lpSend=d=>{if(lpUp()){try{T.lc.send(d);return true}catch(e){}}return false;};

/* ---------- 시작 · 연결 ---------- */
function initT(){
  $('tCode').value=qs.get('code')||lsG('dj_tcode')||lsG('dj_ccode')||'2580';if(qs.get('code'))lsS('dj_tcode',qs.get('code'));
  $('tStart').onclick=startT;
  const ev=jparse(lsG('dj_tev'),[]);if(Array.isArray(ev))T.ev=ev;
  $('bRun').onclick=()=>T.running?stopRun():startRun();
  $('bSleep').onclick=()=>{T.running=false;lsS('dj_trun','0');lpSend({t:'mode',m:'standby'});render();};
  $('bWake').onclick=()=>{lpSend({t:'mode',m:'active'});};
  $('bTap').onclick=()=>addEv('manual');
  $('bMic').onclick=()=>{if(listening())listenOff();else{listenOn(false);}};
  T.mm=lsG('dj_tmm2')||'pat';if(T.mm==='word'&&!SRC)T.mm='pat';$('mMode').value=T.mm;applyMode();
  $('mMode').onchange=()=>{const was=listening();listenOff();T.mm=$('mMode').value;lsS('dj_tmm2',T.mm);applyMode();if(was)listenOn(false);};
  $('mStrict').onchange=()=>{PT.strict=+$('mStrict').value;lsS('dj_tstrict2',$('mStrict').value);patCalib();patUI();};const sv2=lsG('dj_tstrict2');if(sv2){$('mStrict').value=sv2;PT.strict=+sv2;}
  $('bReg').onclick=regToggle;$('bRegClr').onclick=regClear;try{const tp=jparse(lsG('dj_ptpl'),[]);if(Array.isArray(tp))PT.tpl=tp.map(m=>({m,f:(patInit(),patFeat(m.map(r=>Float32Array.from(r))))}));patCalib();}catch(e){}patUI();
  $('mSens').onchange=()=>lsS('dj_tsens',$('mSens').value);const sv=lsG('dj_tsens');if(sv)$('mSens').value=sv;
  $('bCopy').onclick=()=>copyText(csv());
  let clr=0;$('bClr').onclick=()=>{if(Date.now()-clr>4000){clr=Date.now();$('bClr').textContent='정말 지우려면 한 번 더';setTimeout(()=>{$('bClr').textContent='기록 지우기';clr=0},4000);return;}clr=0;$('bClr').textContent='기록 지우기';T.ev=[];saveEv();render();};
  $('mReload').onclick=()=>{lpSend({t:'reload'});log('샤오미 새로고침 요청');};
  render();
  if(!qs.get('setup')&&/^\d{4}$/.test($('tCode').value))startT();   // 저장된 코드가 있으면 열자마자 자동 시작 (코드를 바꾸려면 ?setup=1)
}
function startT(){
  const code=CODE();if(!/^\d{4}$/.test(code)){setT('mSt','코드는 숫자 4자리','bad');$('startBox').hidden=false;return;}
  lsS('dj_tcode',code);$('verT').textContent='v'+VER+' · 아이폰 · 코드 '+code;$('tStart').disabled=true;$('tCode').disabled=true;$('startBox').hidden=true;
  checkLatest((x,k)=>setT('mSt',x,k));setInterval(()=>{if(!T.running)checkLatest((x,k)=>setT('mSt',x,k))},600000);
  keepAwake((t,c)=>setT('mWake',t,c));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){try{if(T.peer&&T.peer.disconnected)T.peer.reconnect()}catch(e){}lpSend({t:'sync'});}});
  setT('mSt','시그널링 서버 연결 중…','dim');setT('lpSt','연결 중…','huge dim');

async function onOpen(c){

function runPings(n){
  if(!lpUp())return;T.pr=[];let i=0;
  const step=()=>{if(i>=n||!lpUp()){setTimeout(finishPings,700);return;}T.lc.send({t:'ping',i,m0:nowE()});i++;setTimeout(step,120);};step();
}
function finishPings(){
  const a=T.pr.slice();if(!a.length){setT('mOff','응답 없음','bad');return;}
  const best=a.slice().sort((x,y)=>x.rtt-y.rtt).slice(0,Math.max(3,Math.ceil(a.length/4)));
  const offs=best.map(x=>x.off).sort((x,y)=>x-y);T.off=offs[offs.length>>1];T.offErr=best[0].rtt/2;
  const r=a.map(x=>x.rtt).sort((x,y)=>x-y);T.rtt=r[r.length>>1];
  setT('mOff',`샤오미 시계가 ${f1(Math.abs(T.off))} ms ${T.off>=0?'빠름':'느림'} (±${f1(T.offErr)} ms) · RTT 중앙 ${f1(T.rtt)} ms`,Math.abs(T.off)<500?'ok':'warn');

const FUSE=1.5;   // 램프와 뻐꾸기가 이 시간(초) 안이면 같은 관중 신호 한 번
const isSrc=e=>e.k==='lamp'||e.k==='tone';
function pairs(){
  const Ls=T.ev.filter(e=>e.k==='lamp'),Ts=T.ev.filter(e=>e.k==='tone'),Vs=T.ev.filter(e=>!isSrc(e));
  // 1) 램프↔뻐꾸기 묶기 → 관중 신호(G)
  const usedT=new Set(),G=[];
  for(const l of Ls){let best=null,bd=1e9;for(const t of Ts){if(usedT.has(t))continue;const d=Math.abs(t.t-l.t)/1000;if(d<=FUSE&&d<bd){bd=d;best=t}}
    if(best)usedT.add(best);G.push({t:l.t,l,tn:best,type:best?'both':'lamp'});}
  for(const t of Ts)if(!usedT.has(t))G.push({t:t.t,l:null,tn:t,type:'tone'});
  G.sort((a,b)=>a.t-b.t);
  // 2) 관중 신호 ↔ 내 신호
  const used=new Set(),pr=[];
  for(const g of G){let best=null,bd=1e9;
    for(const v of Vs){if(used.has(v))continue;const d=(v.t-g.t)/1000;if(d<PAIR_LO||d>PAIR_HI)continue;const sc=Math.abs(d-0.7);if(sc<bd){bd=sc;best=v}}
    if(best){used.add(best);pr.push([g,best]);}}
  const pg=new Map(),pv=new Map(),ge=new Map();pr.forEach(([g,v])=>{pg.set(g,v);pv.set(v,g);});G.forEach(g=>{if(g.l)ge.set(g.l,g);if(g.tn)ge.set(g.tn,g);});

}

const micRs=[];

function micLost(why){   // 조용히 한 번 재시작. 20초 안에 3번째면 포기하고 사용자에게 알린다 (켜졌다 꺼졌다 반복하지 않도록)

  const now=Date.now();while(micRs.length&&now-micRs[0]>20000)micRs.shift();
  if(micRs.length>=2){micGiveUp(why);return;}
  micRs.push(now);M.restarting=true;micOn(true).finally(()=>{M.restarting=false;});
}
function micCheck(){   // 1초마다 점검. 한 번 이상해 보인다고 바로 끊김으로 보지 않고, 4초 연속일 때만 조치
  const M=T.mic;if(!M.want||!M.on||M.restarting)return;
  const tr=M.stream&&M.stream.getAudioTracks()[0];let why=null;
  if(!tr||tr.readyState!=='live')why='트랙이 끝남';
  else if(M.ctx.state!=='running'){M.ctx.resume().catch(()=>{});why='오디오 멈춤('+M.ctx.state+')';}
  if(why){M.bad++;if(M.bad>=4||why==='트랙이 끝남'){M.bad=0;M.flat=0;micLost(why);}}else M.bad=0;
}
setInterval(micCheck,1000);
document.addEventListener('visibilitychange',()=>{const M=T.mic;if(document.visibilityState==='visible'&&M.want&&M.on)try{M.ctx.resume()}catch(e){}});
function micOff(){const M=T.mic;M.want=false;lsS('dj_tmic','0');setBanner('mic');clearInterval(M.t);micRs.length=0;try{if(M.sp){M.sp.onaudioprocess=null;M.sp.disconnect();M.sp=null}M.ctx.onstatechange=null;M.stream.getTracks().forEach(t=>{t.onended=null;t.stop()})}catch(e){}try{M.ctx.close()}catch(e){}M.on=false;$('bMic').textContent='🎤 마이크 켜기';$('bMic').classList.remove('bad');setT('lvlT','마이크 꺼짐','dim');$('lvlB').style.width='0';}

/*PAT-BEGIN*/
/* ---------- 패턴 인식: 내가 등록한 「관중」 소리와 닮은 소리만 센다 (MFCC + DTW, 기기 안에서 계산) ---------- */
const PR=16000,PN=400,PH=160,NFFT=512,NMEL=24,NCEP=13;
const PT={ready:false,hamm:null,mel:null,dct:null,tpl:[],thr:null,reg:false,tmp:[],strict:1.6,hit:null,onSeg:null};
function patFft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<len/2;j++){const a=i+j,b=a+len/2,tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}}
function patInit(){
  if(PT.ready)return;PT.ready=true;
  PT.hamm=new Float64Array(PN);for(let i=0;i<PN;i++)PT.hamm[i]=0.54-0.46*Math.cos(2*Math.PI*i/(PN-1));
  const mel=f=>2595*Math.log10(1+f/700),imel=m=>700*(Math.pow(10,m/2595)-1),lo=mel(100),hi=mel(5000),pts=[];
  for(let i=0;i<NMEL+2;i++)pts.push(imel(lo+(hi-lo)*i/(NMEL+1)));
  const bins=pts.map(f=>Math.floor((NFFT+1)*f/PR));PT.mel=[];
  for(let m=1;m<=NMEL;m++){const f=new Float64Array(NFFT/2+1);
    for(let k=bins[m-1];k<bins[m];k++)f[k]=(k-bins[m-1])/Math.max(1,bins[m]-bins[m-1]);
    for(let k=bins[m];k<bins[m+1];k++)f[k]=(bins[m+1]-k)/Math.max(1,bins[m+1]-bins[m]);PT.mel.push(f)}
  PT.dct=[];for(let c=0;c<NCEP;c++){const r=new Float64Array(NMEL);for(let m=0;m<NMEL;m++)r[m]=Math.cos(Math.PI*c*(m+0.5)/NMEL);PT.dct.push(r)}
}
function patFrame(x,off){
  const re=new Float64Array(NFFT),im=new Float64Array(NFFT);let s=0;
  for(let i=0;i<PN;i++){const v=x[off+i],p=i?x[off+i-1]:v;re[i]=(v-0.97*p)*PT.hamm[i];s+=v*v}
  patFft(re,im);const ps=new Float64Array(NFFT/2+1);for(let k=0;k<ps.length;k++)ps[k]=re[k]*re[k]+im[k]*im[k];
  const le=new Float64Array(NMEL);for(let m=0;m<NMEL;m++){let a=0;const f=PT.mel[m];for(let k=0;k<f.length;k++)if(f[k])a+=f[k]*ps[k];le[m]=Math.log(a+1e-9)}
  const mf=new Float32Array(NCEP);for(let c=0;c<NCEP;c++){let a=0;const r=PT.dct[c];for(let m=0;m<NMEL;m++)a+=r[m]*le[m];mf[c]=a}
  return{mf,e:10*Math.log10(s/PN+1e-10)};
}
function patFeat(F){   // F: MFCC 프레임들 → (계수+변화량) 를 발화 단위로 평균 0·분산 1 정규화
  const n=F.length,D=NCEP*2,M=[];
  for(let t=0;t<n;t++){const v=new Float32Array(D),a=F[Math.min(n-1,t+2)],b=F[Math.max(0,t-2)];for(let c=0;c<NCEP;c++){v[c]=F[t][c];v[NCEP+c]=(a[c]-b[c])/4}M.push(v)}
  for(let c=0;c<D;c++){let m=0;for(let t=0;t<n;t++)m+=M[t][c];m/=n;let q=0;for(let t=0;t<n;t++){const d=M[t][c]-m;q+=d*d}const sd=Math.sqrt(q/n)||1;for(let t=0;t<n;t++)M[t][c]=(M[t][c]-m)/sd}
  return M;
}
function patDtw(A,B){
  const n=A.length,m=B.length,D=A[0].length,band=Math.max(Math.abs(n-m),Math.ceil(0.4*Math.max(n,m))),INF=1e18;
  let prev=new Float64Array(m+1).fill(INF),cur=new Float64Array(m+1).fill(INF);prev[0]=0;
  for(let i=1;i<=n;i++){cur.fill(INF);const j0=Math.max(1,i-band),j1=Math.min(m,i+band);
    for(let j=j0;j<=j1;j++){let s=0;const a=A[i-1],b=B[j-1];for(let d=0;d<D;d++){const x=a[d]-b[d];s+=x*x}
      const c=Math.sqrt(s/D),best=Math.min(prev[j],prev[j-1],cur[j-1]);cur[j]=c+best}
    const t=prev;prev=cur;cur=t}
  return prev[m]/(n+m);
}
function patScore(M,skip){   // 등록한 소리들과의 거리: 가장 가까운 둘의 평균 (skip: 등록 자기 자신 제외용)
  const ds=[];PT.tpl.forEach((T,i)=>{if(i!==skip)ds.push(patDtw(M,T.f))});ds.sort((a,b)=>a-b);
  if(!ds.length)return 9;return ds.length>1?(ds[0]+ds[1])/2:ds[0];
}
function patCalib(){   // 문턱 = 등록 소리끼리의 (자기 제외) 거리 중앙값 × 엄격도
  if(PT.tpl.length<3){PT.thr=null;return}
  const l=PT.tpl.map((t,i)=>patScore(t.f,i)).sort((a,c)=>a-c),med=l[l.length>>1];
  PT.base=med;PT.thr=Math.max(0.1,med)*PT.strict;
}
/* 연속 소리 → 발화 조각 */
const PS={tail:new Float32Array(0),recv:0,fr:[],base:0,idx:0,eh:[],floor:-70,inSeg:false,on:-1,last:-1,loud:0,quiet:0,wall:0,sens:14};
function patReset(){PS.tail=new Float32Array(0);PS.recv=0;PS.fr=[];PS.base=0;PS.idx=0;PS.eh=[];PS.inSeg=false;PS.loud=0;PS.quiet=0;}
function patFeed(x16,wall){
  patInit();PS.wall=wall;
  const t=new Float32Array(PS.tail.length+x16.length);t.set(PS.tail);t.set(x16,PS.tail.length);PS.recv+=x16.length;
  let pos=0;while(pos+PN<=t.length){const fr=patFrame(t,pos);fr.es=PS.recv-(t.length-(pos+PN));patStep(fr);pos+=PH}
  PS.tail=t.slice(pos);
}
function patStep(fr){
  PS.fr.push(fr);const idx=PS.idx++;
  PS.eh.push(fr.e);if(PS.eh.length>800)PS.eh.shift();
  if(idx%25===0&&PS.eh.length>=50){const a=PS.eh.slice().sort((p,q)=>p-q);PS.floor=a[Math.floor(a.length*0.25)];}
  const on=PS.floor+PS.sens,off=on-4,e=fr.e;
  if(!PS.inSeg){
    if(e>=on){PS.loud++;if(PS.loud>=3){PS.inSeg=true;PS.on=idx-2;PS.last=idx;PS.quiet=0;}}else PS.loud=0;
    if(!PS.inSeg&&PS.fr.length>260){PS.fr.shift();PS.base++;}
  }else{
    if(e>=off){PS.last=idx;PS.quiet=0}else{PS.quiet++;if(PS.quiet>=18){PS.inSeg=false;PS.loud=0;patSegment(PS.on,PS.last);}}
    if(PS.inSeg&&idx-PS.on>170){PS.inSeg=false;PS.loud=0;}   // 1.7초 넘게 계속되면 말이 아니라 소음으로 보고 버림
  }
}
function patSegment(on,last){
  const dur=(last-on+1)*0.01;if(dur<0.18||dur>1.6)return;
  const a=Math.max(PS.base,on-3),b=Math.min(PS.idx-1,last+2);if(b-a<10)return;
  const F=[];for(let i=a;i<=b;i++){const f=PS.fr[i-PS.base];if(!f)return;F.push(f.mf)}
  const onWall=PS.wall-(PS.recv-PS.fr[on-PS.base].es)/PR*1000-PN/PR*1000/2;
  if(PT.onSeg){PT.onSeg(F,{dur,onWall});return;}
}
/*PAT-END*/

/* ---------- 단어 인식: 「관중」이라는 말만 센다 (아이폰 사파리의 음성 인식, 한국어) ---------- */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const KW=/관중|관종|광중|관쭝|관증|간중|완중/g;
const kwCount=t=>{const m=String(t).replace(/[\s.,?!]+/g,'').match(KW);return m?m.length:0;};
const SR={on:false,rec:null,want:false,cnt:{},last:'',errs:0};
function applyMode(){const m=T.mm,w=m==='word',p=m==='pat';
  $('mSens').style.display=w?'none':'';$('lvlBox').style.display=w?'none':'';$('patBox').style.display=p?'':'none';
  setT('lvlT',w?'단어 인식 방식 — 마이크를 켜면 들린 말이 여기 표시됩니다':'마이크 꺼짐','dim');
  $('micHelp').textContent=p?'먼저 「🎓 내 목소리 등록」으로 「관중」을 5번 말해 등록하세요. 그 뒤로는 등록한 소리와 닮은 소리만 셉니다(기침·다른 말은 세지 않음). 서버를 쓰지 않아 쉬었다 말해도 똑같이 잡히고, 말이 끝나면 곧바로 셉니다.'
    :(w?'「관중」이라는 말이 인식될 때만 셉니다. 사파리 음성 인식은 한동안 쉬었다 말하면 놓치는 일이 있습니다.':'소리가 커지는 순간을 한 번으로 셉니다(어떤 소리든 셉니다). 이어폰 마이크로 말하세요.');}
const listening=()=>T.mm==='word'?SR.on||SR.want:T.mic.on||T.mic.want;
function listenOn(auto){
  if(T.mm==='word'){
    if(!SRC){log('이 브라우저는 단어 인식을 지원하지 않음 → 소리 크기 방식');T.mm='level';$('mMode').value='level';applyMode();}
    else{srOn(auto);return;}
  }
  T.mic.want=true;micRs.length=0;micOn(auto);
}
function listenOff(){
  if(T.mm==='word')srOff();else micOff();
  lsS('dj_tmic','0');$('bMic').textContent='🎤 마이크 켜기';$('bMic').classList.remove('bad');
}
function srOn(auto){
  SR.want=true;SR.errs=0;lsS('dj_tmic','1');
  try{
    const rec=SR.rec=new SRC();rec.lang='ko-KR';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onstart=()=>{SR.on=true;SR.cnt={};$('bMic').textContent='🎤 마이크 끄기';$('bMic').classList.remove('bad');setBanner('mic');log('단어 인식 켜짐');};
    rec.onresult=e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const txt=e.results[i][0].transcript,n=kwCount(txt),prev=SR.cnt[i]||0;SR.last=txt;
        if(n>prev){for(let k=prev;k<n;k++)addEv('voice',Date.now()-450,{src:'word',txt});SR.cnt[i]=n;}
        if(e.results[i].isFinal)log('인식: '+txt+(n?'  → 관중 '+n:''));
      }
      setT('lvlT','들린 말: '+SR.last,'dim');SR.errs=0;
    };
    rec.onerror=e=>{log('음성인식 오류: '+e.error);
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){SR.want=false;SR.on=false;
        setBanner('mic','🎤 이 브라우저에서는 단어 인식 권한이 없습니다 — 사파리로 열거나 방식을 「소리 크기」로 바꾸세요');$('bMic').textContent='🎤 마이크 켜기';}
      else if(e.error==='network'||e.error==='audio-capture'){SR.errs++;}};
    rec.onend=()=>{SR.on=false;
      if(SR.want){if(SR.errs>=5){SR.want=false;setBanner('mic','🎤 단어 인식이 계속 끊깁니다 — 인터넷을 확인하거나 방식을 「소리 크기」로 바꾸세요');$('bMic').textContent='🎤 마이크 켜기';return;}
        setTimeout(()=>{if(SR.want)try{rec.start()}catch(e){}},300);}};
    rec.start();
    setT('lvlT','단어 인식 시작 중… (허용 팝업이 뜨면 허용)','dim');$('bMic').textContent='🎤 마이크 끄기';
  }catch(e){log('단어 인식 시작 실패: '+((e&&e.message)||e));SR.want=false;
    if(!auto){setT('lvlT','⛔ 단어 인식을 시작하지 못했습니다 — 방식을 「소리 크기」로 바꿔 보세요','bad');}}
}
function srOff(){SR.want=false;try{SR.rec&&SR.rec.stop()}catch(e){}SR.on=false;setT('lvlT','마이크 꺼짐','dim');}

function patAttach(ctx,src){
  patReset();PS.sens=+$('mSens').value||14;PT.hit=patOnSeg;
  const sp=ctx.createScriptProcessor(2048,1,1),r=ctx.sampleRate/PR;let acc=0,n=0,ph=0;
  sp.onaudioprocess=e=>{const x=e.inputBuffer.getChannelData(0),out=[];
    for(let i=0;i<x.length;i++){acc+=x[i];n++;ph+=1;if(ph>=r){out.push(acc/n);acc=0;n=0;ph-=r}}
    PS.sens=+$('mSens').value||14;patFeed(Float32Array.from(out),Date.now());};
  const mute=ctx.createGain();mute.gain.value=0;src.connect(sp);sp.connect(mute);mute.connect(ctx.destination);T.mic.sp=sp;
  PT.onSeg=patOnSeg;
}
function patOnSeg(F,info){
  if(PT.reg){
    PT.tmp.push(F.map(f=>Array.from(f,v=>Math.round(v*100)/100)));
    patUI();log(`등록 소리 ${PT.tmp.length}/5 (${info.dur.toFixed(2)}초)`);
    if(PT.tmp.length>=5){PT.reg=false;PT.tpl=PT.tmp.map(m=>({m,f:patFeat(m.map(r=>Float32Array.from(r)))}));PT.tmp=[];patCalib();
      lsS('dj_ptpl',JSON.stringify(PT.tpl.map(t=>t.m)));patUI();log(`등록 완료 · 등록 소리끼리 거리 ${f1(PT.base)} · 문턱 ${f1(PT.thr)}`);}
    return;}
  if(PT.thr==null)return;
  const sc=patScore(patFeat(F)),ok=sc<=PT.thr;
  log(`소리 조각 ${info.dur.toFixed(2)}초 · 거리 ${sc.toFixed(2)} / 문턱 ${PT.thr.toFixed(2)} → ${ok?'✔ 관중':'✘ 제외'}`);
  setT('lvlT',`방금 소리: 거리 ${sc.toFixed(2)} (문턱 ${PT.thr.toFixed(2)}) ${ok?'✔ 관중':'✘ 제외'}`,ok?'ok':'dim');
  if(ok)addEv('voice',info.onWall,{src:'pat',d:+sc.toFixed(3)});
}
function regToggle(){
  if(PT.reg){PT.reg=false;PT.tmp=[];patUI();return;}
  if(!listening()){T.mm='pat';listenOn(false);}
  PT.reg=true;PT.tmp=[];patUI();
}
function regClear(){PT.tpl=[];PT.tmp=[];PT.reg=false;PT.thr=null;lsS('dj_ptpl','[]');patUI();log('등록 소리 지움');}
function patUI(){
  const b=$('bReg');if(!b)return;
  if(PT.reg){b.textContent='⏹ 등록 중단';b.className='stop';setT('patT',`등록 중 ${PT.tmp.length}/5 — 「관중」을 한 번씩 또박또박, 한 번 말하고 1초쯤 쉬세요`,'warn');}
  else{b.textContent=PT.tpl.length?'🎓 다시 등록':'🎓 내 목소리 등록 (관중 ×5)';b.className='sub';
    setT('patT',PT.tpl.length?(PT.thr!=null?`등록 ${PT.tpl.length}개 · 문턱 ${PT.thr.toFixed(2)} (낮을수록 엄격)`:'등록이 부족합니다'):'아직 등록 안 됨 — 「관중」을 5번 말해 등록하세요',PT.tpl.length?'ok':'warn');}
}
function micTick(){
  const M=T.mic;if(!M.on)return;M.an.getFloatTimeDomainData(M.buf);
  let s=0;for(let i=0;i<M.buf.length;i++)s+=M.buf[i]*M.buf[i];const db=10*Math.log10(s/M.buf.length+1e-12);M.db=db;if(db<-100)M.flat++;else M.flat=0;
  M.hist.push(db);if(M.hist.length>320)M.hist.shift();
  if(M.hist.length%8===0){const a=M.hist.slice().sort((x,y)=>x-y);M.floor=a[Math.floor(a.length*0.25)];}   // 바닥 소음 = 최근 8초의 아래쪽 25% 지점
  const thr=+$('mSens').value,up=db-M.floor;
  $('lvlB').style.width=Math.max(0,Math.min(100,up/40*100))+'%';$('lvlB').style.background=up>=thr?'var(--warn)':'var(--ok)';
  setT('lvlT',`현재 ${f1(db)} dB · 바닥 ${f1(M.floor)} dB · 차이 ${f1(up)} dB (문턱 ${thr})`,'dim');
  const now=performance.now();
  if(up>=thr){M.above++;if(T.mm==='level'&&M.above===2&&now-M.last>1000&&T.running){M.last=now;addEv('voice',Date.now()-50);}}
  else if(up<thr-5)M.above=0;
}
initT();if(lsG('dj_tmic')==='1')listenOn(true);   // 새로고침 뒤에도 마이크를 쓰던 중이었으면 복구 시도 (실패하면 ‘다시 켜기’ 버튼)

</script>
